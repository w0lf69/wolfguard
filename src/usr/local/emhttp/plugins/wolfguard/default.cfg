# WolfGuard Default Configuration
# Backup target directory
BACKUP_DIR="/mnt/user/claudebackups/wolfguard"
# Compression level (1-19, 3 is good balance for speed vs size)
ZSTD_LEVEL="3"
# Compression threads
ZSTD_THREADS="2"
# Retention: keep last N backups per VM
RETENTION_TIER1="5"
RETENTION_TIER2="3"
# Schedule (cron format)
SCHEDULE_TIER1="0 3 * * *"
SCHEDULE_TIER2="0 3 * * 0"
# VM assignments (comma-separated VM names)
VMS_TIER1=""
VMS_TIER2=""
# Pushover (failures only)
PUSHOVER_APP_TOKEN=""
PUSHOVER_USER_KEY=""
# Backblaze B2 (future)
B2_ENABLED="false"
B2_BUCKET=""
B2_KEY_ID=""
B2_APP_KEY=""
# Logging
LOG_DIR="/var/log/wolfguard"
LOG_RETENTION_DAYS="30"
